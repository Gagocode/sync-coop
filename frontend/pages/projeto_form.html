<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ "Editar" if project else "Novo" }} Projeto - Sync Disc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/journey.css">
    <link rel="stylesheet" href="/assets/css/identity.css">
    <link rel="stylesheet" href="/assets/css/symbols.css">
  </head>
  <body>
    <main class="app-shell">
      <div class="app-page-hero"><div><p class="page-eyebrow"><svg class="sd-icon sd-inline-icon" aria-hidden="true"><use href="/assets/images/symbols.svg#resume"></use></svg>Currículo Vivo</p><h1><svg class="sd-icon sd-heading-icon" aria-hidden="true"><use href="/assets/images/symbols.svg#project"></use></svg>{{ "Editar" if project else "Novo" }} projeto</h1><p>Registre o trabalho realizado e as tecnologias que fizeram parte dele.</p></div></div>
      {% if error %}
        <p class="error-message">{{ error }}</p>
      {% endif %}
      <form class="form-panel" action="{{ '/projetos/' ~ project.id ~ '/editar' if project else '/projetos/' }}" method="post">
        <label>
          Titulo
          <input type="text" name="titulo" value="{{ project.titulo if project else '' }}" required>
        </label>
        <label>
          Descricao
          <textarea name="descricao" required>{{ project.descricao if project else '' }}</textarea>
        </label>
        <label>
          Tecnologias
          <input type="text" name="tecnologias" value="{{ project.tecnologias if project else '' }}" required>
        </label>
        <label>
          Link
          <input type="url" name="link" value="{{ project.link if project and project.link else '' }}">
        </label>
        <button type="submit">Salvar</button>
      </form>
      <p><a href="/projetos/">Voltar para projetos</a></p>
    </main>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
